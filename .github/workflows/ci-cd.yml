name: MobileShop CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint_and_unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Lint (if present)
        run: npm run lint --if-present
        working-directory: server
      - name: Run unit tests
        run: npm test
        working-directory: server

  build_docker_images:
    runs-on: ubuntu-latest
    needs: lint_and_unit_tests
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway image
        run: docker build -t mobile-shop-gateway:ci ./gateway
      - name: Build auth image
        run: docker build -t mobile-shop-auth:ci ./services/auth-service
      - name: Build catalog image
        run: docker build -t mobile-shop-catalog:ci ./services/catalog-service
      - name: Build order image
        run: docker build -t mobile-shop-order:ci ./services/order-service
      - name: Build backend image
        run: docker build -t mobile-shop-backend:ci ./server

  deploy_test_environment:
    runs-on: ubuntu-latest
    needs: build_docker_images
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to test namespace (placeholder)
        run: echo "kubectl apply -f k8s/mobile-shop.yaml --namespace=test"

  integration_tests:
    runs-on: ubuntu-latest
    needs: deploy_test_environment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run API integration tests
        run: npm run test:integration
        working-directory: server
      - name: Run Newman suite
        run: npm run test:newman
        working-directory: server

  deploy_staging_or_production:
    runs-on: ubuntu-latest
    needs: integration_tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Helm deploy (placeholder)
        run: echo "helm upgrade --install mobile-shop ./helm/mobile-shop --namespace=staging --create-namespace"
