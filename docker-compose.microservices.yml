version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mobile-shop-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mobile_shop
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  consul:
    image: hashicorp/consul:1.17
    container_name: mobile-shop-consul
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"

  eureka-server:
    build:
      context: ./services/eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"

  consul-register:
    image: alpine:3.19
    container_name: mobile-shop-consul-register
    depends_on:
      - consul
      - auth-service
      - catalog-service
      - order-service
      - inventory-service
      - admin-service
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
    volumes:
      - ./infra/consul/register-services.sh:/register.sh:ro
    command:
      [
        "/bin/sh",
        "-c",
        "apk add --no-cache curl >/dev/null && chmod +x /register.sh && exec /register.sh",
      ]
    restart: "no"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: mobile-shop-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7-alpine
    container_name: mobile-shop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: mobile-shop-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: mobile-shop-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      PORT: 4001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: mobile_shop
      JWT_SECRET: dev_secret_change_me
    depends_on:
      - mysql
      - rabbitmq
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    ports:
      - "4001:4001"

  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    container_name: catalog-service
    environment:
      PORT: 4002
      GRPC_PORT: 50052
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: mobile_shop
      JWT_SECRET: dev_secret_change_me
      REDIS_URL: redis://redis:6379
    depends_on:
      - mysql
      - kafka
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4002/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    ports:
      - "4002:4002"
      - "50052:50052"

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: order-service
    environment:
      PORT: 4003
      RABBITMQ_URL: amqp://rabbitmq:5672
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: order-created
      INVENTORY_GRPC_URL: catalog-service:50052
      ENABLE_KAFKA_AUDIT_CONSUMER: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: mobile_shop
      JWT_SECRET: dev_secret_change_me
    depends_on:
      - mysql
      - rabbitmq
      - kafka
      - catalog-service
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4003/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    ports:
      - "4003:4003"

  inventory-service:
    build:
      context: ./services/inventory-service-spring
      dockerfile: Dockerfile
    container_name: inventory-service
    depends_on:
      - mysql
      - eureka-server
      - rabbitmq
      - catalog-service
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/mobile_shop
      DB_USER: root
      DB_PASSWORD: root
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_RABBITMQ_HOST: rabbitmq
      CATALOG_SERVICE_BASE_URL: http://catalog-service:4002
    ports:
      - "8081:8081"

  admin-service:
    build:
      context: ./services/admin-service-django
      dockerfile: Dockerfile
    container_name: admin-service
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
    ports:
      - "8001:8001"

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: mobile-shop-gateway
    environment:
      PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:4001
      CATALOG_SERVICE_URL: http://catalog-service:4002
      ORDER_SERVICE_URL: http://order-service:4003
      INVENTORY_SERVICE_URL: http://inventory-service:8081
      ADMIN_SERVICE_URL: http://admin-service:8001
      CONSUL_URL: http://consul:8500
      EUREKA_URL: http://eureka-server:8761/eureka
    depends_on:
      - auth-service
      - catalog-service
      - order-service
      - inventory-service
      - admin-service
      - eureka-server
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    ports:
      - "8080:8080"

  nginx:
    image: nginx:1.26-alpine
    container_name: mobile-shop-nginx
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9080:80"
    depends_on:
      - gateway

  kong:
    profiles:
      - kong
    image: kong:3.5
    container_name: mobile-shop-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./infra/kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "9130:8000"
      - "9131:8001"
    depends_on:
      - gateway

volumes:
  mysql_data:
