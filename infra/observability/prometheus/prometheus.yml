global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "gateway"
    metrics_path: /health
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: "auth-service"
    metrics_path: /health
    static_configs:
      - targets: ["auth-service:4001"]

  - job_name: "catalog-service"
    metrics_path: /health
    static_configs:
      - targets: ["catalog-service:4002"]

  - job_name: "order-service"
    metrics_path: /health
    static_configs:
      - targets: ["order-service:4003"]

  - job_name: "backend-server"
    metrics_path: /health
    static_configs:
      - targets: ["host.docker.internal:3001"]
